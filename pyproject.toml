[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wmh-multisite"
version = "0.1.0"
description = "Multi-site white matter hyperintensity pipeline: preprocessing, quality control, segmentation, evaluation, biomarkers and harmonization on the MICCAI WMH 2017 dataset."
readme = "README.md"
license = "MIT"
authors = [{ name = "Jean Barreto" }]
requires-python = ">=3.11"
keywords = ["neuroimaging", "MRI", "white matter hyperintensities", "segmentation", "harmonization", "nnU-Net"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Intended Audience :: Science/Research",
]

# Core: everything the local (CPU) part of the pipeline needs.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "nibabel>=5.2",
    "SimpleITK>=2.3",        # official WMH challenge evaluation script
    "antspyx>=0.6",          # N4, rigid and SyN registration
    "scikit-learn>=1.4",
    "scikit-image>=0.22",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "psutil>=5.9",           # memory watchdog (utils/guard.py)
    "requests>=2.31",        # DataverseNL API
    "tqdm>=4.66",
    "templateflow>=25.1.2",
]

[project.optional-dependencies]
# Synthetic artifacts for QC validation (pulls PyTorch).
qc = ["torchio>=1.2"]
# Feature-level harmonization (ComBat / ComBat-GAM).
# neuroHarmonize 2.5.x pins numpy<2, so the resolver falls back to 2.4.5, whose
# metadata declares no dependencies: its runtime imports are listed explicitly (J-022).
harmonize = ["neuroHarmonize>=2.4", "neuroCombat==0.2.12", "statsmodels>=0.14"]
# Deep-learning segmentation and brain extraction: run on Kaggle GPU, not locally.
seg = ["nnunetv2>=2.6", "hd-bet>=2.0"]
# End-to-end orchestration and carbon footprint.
workflow = ["snakemake>=8.0", "codecarbon>=2.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "ipykernel>=6.29", "nbstripout>=0.7"]
# Everything that is meant to run on the local machine.
local = ["wmh-multisite[qc,harmonize,workflow,dev]"]

[project.urls]
Dataset = "https://doi.org/10.34894/AECRSD"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: tests that run real registration or large volumes",
    "data: tests that need the downloaded WMH dataset",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

# CI: lint, tests and the Docker image on every push and pull request.
# No data needed: the tests build tiny synthetic images. Same locked versions (uv.lock) as locally.
name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --frozen --extra local

      - name: Lint (ruff)
        run: |
          uv run ruff check src tests scripts hpc
          uv run ruff format --check src tests scripts hpc

      - name: Workflow syntax (Snakemake)
        run: uv run snakemake -s workflow/Snakefile --lint || true   # advisory: the DAG needs the data

      - name: Tests (pytest)
        run: uv run pytest -q --cov=wmh_multisite --cov-report=term

  # the CPU image must build from the locked environment and import the pipeline
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the CPU image
        run: docker build -f containers/Dockerfile -t wmh-multisite:ci .

      - name: Smoke test
        run: |
          docker run --rm wmh-multisite:ci python -c "import wmh_multisite, ants, SimpleITK, nibabel, neuroHarmonize; print('imports ok')"
          docker run --rm wmh-multisite:ci snakemake --version
          docker run --rm wmh-multisite:ci python -m wmh_multisite.evaluate.metrics --help
